# Netlify configuration for CloseConnect
# This is a plain static site — no build step, no framework.
# Netlify just serves the files in this folder as-is.

[build]
  # Nothing to compile; publish the project root.
  publish = "."
  command = ""

# Serverless functions (the Claude AI advisor lives here).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Weekly broken-link checker — runs Mondays at 14:00 UTC (~6–7am Pacific).
[functions."link-check"]
  schedule = "0 14 * * 1"
