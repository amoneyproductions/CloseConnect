# Netlify configuration for CloseConnect
# This is a plain static site — no build step, no framework.
# Netlify just serves the files in this folder as-is.

[build]
  # Nothing to compile; publish the project root.
  publish = "."
  command = ""

# Serverless functions (the Claude AI advisor lives here).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Weekly broken-link checker — runs Mondays at 14:00 UTC (~6–7am Pacific).
[functions."link-check"]
  schedule = "0 14 * * 1"

# Security headers applied to every response. These are what a university IT
# security scan looks for. The Content-Security-Policy limits where scripts,
# styles, fonts, and connections may come from, which neutralizes most XSS.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; upgrade-insecure-requests"
